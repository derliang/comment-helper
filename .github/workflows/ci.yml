name: CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: comment-helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: version.json releaseDate comes from the commit that set VERSION
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.mjs && node --check engine.mjs && node --check deep-nlg.mjs && node --check importers.mjs && node --check advanced.mjs && node --check server/ai-proxy.mjs && node --check handoff.mjs && node --check roundtrip.mjs && node --test
      - name: Build static site with pinned vendor scripts
        run: bash scripts/build-site.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.51.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium webkit
      - name: Browser release gate
        run: |
          python tests/browser-smoke.py
          python tests/class-release.py
          python tests/mobile-webkit.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
